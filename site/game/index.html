<script>
'use strict';
/* ── Coyote on the Powell-Hyde Line ──────────────────────────────────────────
   A side-scrolling walk over San Francisco's hills in the risograph style of
   the film Hyde Street. The scenery is printed once at load: each parallax
   layer is drawn as per-ink coverage, screened into halftone dots and kept as
   tiles. Each frame only screens what moves (the coyote, cable cars, gulls)
   into small sprites. No libraries, no images; one embedded
   public-domain gull recording.                                            */

const W = 1280, H = 720, PITCH = 4.2;
const INK = { yellow: '#FFE800', orange: '#FF6C2F', pink: '#FF48B0', blue: '#0078BF', indigo: '#2E3192' };
const PL = ['yellow', 'orange', 'pink', 'blue', 'indigo'];
const SCREEN = { yellow: { a: 1, b: 0 }, orange: { a: 2, b: 1 }, pink: { a: 1, b: 4 }, blue: { a: 4, b: 1 }, indigo: { a: 1, b: 1 } };
const REG = { yellow: [2, 1], orange: [1, 2], pink: [-2, 2], blue: [1, -1], indigo: [0, 0] };
const PAPER = [242, 237, 227];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, u) => a + (b - a) * u, TAU = Math.PI * 2;
const sm = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
function mulberry32(a) { return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const rngFor = k => mulberry32(hash(k));
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const C = (y = 0, o = 0, p = 0, b = 0, i = 0) => ({ yellow: y, orange: o, pink: p, blue: b, indigo: i });
const cadd = (a, b, k = 1) => { const o = {}; for (const n of PL) o[n] = (a[n] || 0) + (b[n] || 0) * k; return o; };
const cmix = (a, b, u) => { const o = {}; for (const n of PL) o[n] = lerp(a[n] || 0, b[n] || 0, u); return o; };
const INKM = PL.map(n => [1, 3, 5].map(i => parseInt(INK[n].substr(i, 2), 16) / 255));

/* ── halftone screens (rational angles, as in the film's engine) ─────────── */
function buildScreen(name) {
  const { a, b } = SCREEN[name], n = a * a + b * b, S = Math.max(2, Math.round(PITCH * Math.sqrt(n))), P = S / Math.sqrt(n), u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a], pts = [];
  for (let m = -n; m <= n; m++) for (let k = -n; k <= n; k++) {
    const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1], wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
    if (!pts.some(p => Math.abs(p[0] - wx) < .01 && Math.abs(p[1] - wy) < .01)) pts.push([wx, wy]);
  }
  const wrapped = []; for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);
  const th = new Uint8Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let d2 = Infinity; for (const [px, py] of wrapped) { const dx = x + .5 - px, dy = y + .5 - py, q = dx * dx + dy * dy; if (q < d2) d2 = q; }
    th[y * S + x] = clamp(Math.round(clamp(Math.PI * d2 / (P * P), 0, 1) * 236 + 8), 2, 250);
  }
  return { S, th };
}
const SC = PL.map(buildScreen);
const JIT = (() => { const r = rngFor('jitter'), a = new Int8Array(256 * 256); for (let i = 0; i < a.length; i++) a[i] = Math.round((r() - .5) * 18); return a; })();

/* Coverage canvases (alpha = ink amount) → hard dots on paper, one ink at a time.
   ox, oy pin the screen: layer coordinates for baked tiles, page coordinates for sprites. */
function screenInto(out, covs, mask, w, h, ox, oy) {
  const od = out.data, md = mask.getImageData(0, 0, w, h).data;
  const cd = covs.map(g => g.getImageData(0, 0, w, h).data);
  for (let i = 0, p = 0; i < w * h; i++, p += 4) {
    if (md[p + 3] < 8) { od[p + 3] = 0; continue; }
    od[p] = PAPER[0]; od[p + 1] = PAPER[1]; od[p + 2] = PAPER[2]; od[p + 3] = md[p + 3];
  }
  for (let k = 0; k < 5; k++) {
    const { S, th } = SC[k], [mr, mg, mb] = INKM[k], [dx, dy] = REG[PL[k]], a = cd[k];
    for (let y = 0; y < h; y++) {
      const sy = y - dy; if (sy < 0 || sy >= h) continue;
      const gy = y + oy, row = ((gy % S) + S) % S * S, jr = (gy & 255) << 8;
      for (let x = 0; x < w; x++) {
        const sx = x - dx; if (sx < 0 || sx >= w) continue;
        const c = a[(sy * w + sx) * 4 + 3]; if (c < 3) continue;
        const gx = x + ox, t = th[row + ((gx % S) + S) % S] + JIT[jr | (gx & 255)];
        if (c > t) { const p = (y * w + x) * 4; if (md[p + 3] < 8) continue; od[p] *= mr; od[p + 1] *= mg; od[p + 2] *= mb; }
      }
    }
  }
}
/* A drawing surface: five coverage contexts and a silhouette mask. put() makes a
   shape own its value on every plate (occlusion), as in the film's compositor. */
function surface(w, h) {
  const mk = () => cv(w, h).getContext('2d', { willReadFrequently: true });
  return { w, h, covs: PL.map(mk), mask: mk() };
}
function clearSurface(s) { for (const g of [...s.covs, s.mask]) { g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, s.w, s.h); } }
function setT(s, a, b, c, d, e, f) { for (const g of [...s.covs, s.mask]) g.setTransform(a, b, c, d, e, f); }
function put(s, path, cov, rule) {
  s.mask.globalCompositeOperation = 'source-over'; s.mask.globalAlpha = 1; s.mask.fillStyle = '#000'; s.mask.fill(path, rule || 'nonzero');
  s.covs.forEach((g, k) => {
    g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1; g.fillStyle = '#000'; g.fill(path, rule || 'nonzero');
    const c = cov[PL[k]]; if (c > 0) { g.globalCompositeOperation = 'lighter'; g.fillStyle = typeof c === 'number' ? '#000' : c; g.globalAlpha = typeof c === 'number' ? clamp(c, 0, 1) : 1; g.fill(path, rule || 'nonzero'); }
  });
}
function putGrad(s, path, x0, y0, x1, y1, covA, covB) {        // a vertical/any-angle ramp that prints as dot size
  s.mask.globalCompositeOperation = 'source-over'; s.mask.globalAlpha = 1; s.mask.fillStyle = '#000'; s.mask.fill(path);
  s.covs.forEach((g, k) => {
    g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1; g.fillStyle = '#000'; g.fill(path);
    const a = covA[PL[k]] || 0, b = covB[PL[k]] || 0; if (a <= 0 && b <= 0) return;
    const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, `rgba(0,0,0,${clamp(a, 0, 1)})`); gr.addColorStop(1, `rgba(0,0,0,${clamp(b, 0, 1)})`);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 1; g.fillStyle = gr; g.fill(path);
  });
}
function strokeOn(s, path, cov, w) {
  s.mask.globalCompositeOperation = 'source-over'; s.mask.globalAlpha = 1; s.mask.lineWidth = w; s.mask.strokeStyle = '#000'; s.mask.stroke(path);
  s.covs.forEach((g, k) => {
    g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1; g.lineWidth = w; g.strokeStyle = '#000'; g.stroke(path);
    const c = cov[PL[k]]; if (c > 0) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = clamp(c, 0, 1); g.stroke(path); }
  });
}
const poly = (pts) => { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); return p; };
const rect = (x, y, w, h) => { const p = new Path2D(); p.rect(x, y, w, h); return p; };
const ell = (x, y, rx, ry, rot = 0) => { const p = new Path2D(); p.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); return p; };
function curvePts(pts, closed) {                                  // Catmull-Rom through points
  const out = [], n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const [p0, p1, p2, p3] = [P(i - 1), P(i), P(i + 1), P(i + 2)];
    for (let t = 0; t < 1; t += 1 / 8) { const t2 = t * t, t3 = t2 * t;
      out.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); }
  }
  if (!closed) out.push(pts[n - 1]);
  return out;
}
const smooth = (pts) => poly(curvePts(pts, true));

/* ── the route: hills in world pixels (x right, h up) ─────────────────────────
   Union Square flat, the Powell climb, the Nob Hill crest at California, down to
   Jackson, up Russian Hill to Lombard, the Hyde plunge, then the beach. Grades are
   exaggerated from the real 17% and 21% so they read as a walk. */
const L = 7900, FINISH = 7560;
const KEYS = [[-400, 0], [760, 0], [2050, 540], [2360, 540], [3000, 255], [3260, 255], [4350, 600], [4760, 600], [6350, -10], [8400, -10]];
const HT = (() => {
  const raw = new Float32Array(L + 1200), off = 600;
  for (let i = 0; i < raw.length; i++) {
    const x = i - off; let h = KEYS[KEYS.length - 1][1];
    for (let k = 0; k < KEYS.length - 1; k++) if (x <= KEYS[k + 1][0]) { const [x0, h0] = KEYS[k], [x1, h1] = KEYS[k + 1]; h = lerp(h0, h1, (x - x0) / (x1 - x0)); break; }
    raw[i] = h;
  }
  const out = new Float32Array(raw.length), R = 110;                // round every corner
  let acc = 0; for (let i = 0; i < raw.length; i++) { acc += raw[i]; if (i >= 2 * R + 1) acc -= raw[i - 2 * R - 1]; out[Math.max(0, i - R)] = acc / Math.min(i + 1, 2 * R + 1); }
  for (let i = raw.length - R; i < raw.length; i++) out[i] = raw[i];
  return { out, off };
})();
const hAt = x => { const f = clamp(x + HT.off, 0, HT.out.length - 2), i = f | 0; return lerp(HT.out[i], HT.out[i + 1], f - i); };
const slopeAt = x => (hAt(x + 6) - hAt(x - 6)) / 12;

/* Screen placement. The camera keeps the coyote near x = CAMX_SCREEN; heights map
   to screen y = BASE + camH·py − h for a layer with vertical parallax py. */
const CAMX_SCREEN = 470, BASE = 590;
const lxOf = (X, p, sx) => sx + (X - CAMX_SCREEN) * p;          // layer x where world X shows at screen sx under the coyote

/* ── colour ─────────────────────────────────────────────────────────────── */
const VIC = [C(.44, .06), C(0, .03, .24, .05), C(.04, 0, .02, .32), C(.30, 0, 0, .26), C(.02, .08, .18, .14), C(.22, .30, .03), C(.03, .01, .02, .02), C(.50, .30, .06, 0, .02), C(.10, 0, .32, .02)];
const HOT = [C(.14, .05), C(.24, .16, .05, 0, .02), C(.26, .60, .30, 0, .12), C(.05, .03, .03, .10, .06), C(.30, .22, .02)];
const GLASS = C(0, 0, 0, .48, .28), TRIM = C(.03, .01), DARK = C(.04, .06, .12, .34, .46);
const progressTone = u => u < .6 ? { hz: cmix(C(0, 0, .02, .16), C(.04, 0, .08, .13), u / .6) } : { hz: cmix(C(.04, 0, .08, .13), C(.04, .06, .22, .12), (u - .6) / .4) };

/* ── baked layers ───────────────────────────────────────────────────────── */
const LAYERS = [];
async function bakeLayer(o) {
  // o: { name, p, py, width, y0, y1 (layer y range), bandOf(tx0,tx1)->[ya,yb], draw(s, x0, x1) }
  const TW = 512, tiles = [];
  for (let x0 = 0; x0 < o.width; x0 += TW) {
    const w = Math.min(TW, o.width - x0), [ya, yb] = o.bandOf ? o.bandOf(x0, x0 + w) : [o.y0, o.y1], h = Math.max(4, Math.ceil(yb - ya));
    const s = surface(w, h); setT(s, 1, 0, 0, 1, -x0, -ya);
    o.draw(s, x0 - 60, x0 + w + 60, ya, yb);
    const c = cv(w, h), g = c.getContext('2d'), img = g.createImageData(w, h);
    screenInto(img, s.covs, s.mask, w, h, x0, ya); g.putImageData(img, 0, 0);
    tiles.push({ x: x0, y: ya, w, h, c });
    progress(o.name, x0 / o.width);
    await new Promise(r => setTimeout(r, 0));
  }
  LAYERS.push(Object.assign({ tiles }, o));
}
function drawLayer(g, L1, camX, camH) {
  const ox = -camX * L1.p, oy = (L1.oy || 0) + camH * L1.py;
  for (const t of L1.tiles) { const x = Math.round(t.x + ox); if (x > W || x + t.w < 0) continue; g.drawImage(t.c, x, Math.round(t.y + oy)); }
}

/* Sky: a ramp from zenith to horizon that warms from afternoon to sunset along the route. */
const SKY_P = .06;
function drawSkyLayer(s, x0, x1) {
  const Wd = W + L * SKY_P;
  for (let x = Math.floor(x0 / 40) * 40; x < x1; x += 40) {
    const u = clamp(x / Wd, 0, 1);
    const top = cmix(C(0, 0, 0, .56), C(0, 0, .2, .5, .26), sm((u - .45) / .55)), hor = cmix(C(.12, 0, 0, .02), C(.46, .5, .24, 0), sm((u - .35) / .65));
    putGrad(s, rect(x, 0, 41, 720), 0, 0, 0, 470, top, hor);
  }
}
/* Far: the bay, East Bay hills and the Bay Bridge early on; Alcatraz, Marin and the Golden Gate at the end. */
const FAR_P = .16, FAR_PY = .06, HORIZON = 352;
function drawFarLayer(s, x0, x1) {
  const sea = C(0, 0, .03, .52, .14);
  put(s, rect(x0, HORIZON, x1 - x0, 400), sea);
  const ridge = (xa, xb, base, amp, key, cov) => {
    const r = rngFor(key), pts = [[xa, HORIZON + 2]];
    for (let x = xa; x <= xb; x += 24) { const u = (x - xa) / (xb - xa); pts.push([x, HORIZON - base - amp * Math.sin(u * Math.PI) ** .7 - 10 * Math.sin(x / 37 + r() * 3)]); }
    pts.push([xb, HORIZON + 2]); put(s, poly(pts), cov);
  };
  const eb0 = lxOf(900, FAR_P, 200), eb1 = lxOf(3900, FAR_P, 1300);
  if (eb1 > x0 && eb0 < x1) ridge(eb0, eb1, 14, 44, 'eastbay', C(.06, .04, .12, .30, .08));
  // Bay Bridge: towers and cable across the water while we cross Nob Hill
  const bb0 = lxOf(1700, FAR_P, 380), bb1 = bb0 + 560;
  if (bb1 > x0 && bb0 < x1) {
    const col = C(.03, .02, .06, .36, .42), dz = HORIZON - 26;
    put(s, rect(bb0, dz, bb1 - bb0, 4), col);
    const tw = [.12, .34, .66, .88].map(u => lerp(bb0, bb1, u));
    for (const x of tw) put(s, rect(x - 2, dz - 58, 4, 58 + 26), col);
    const cab = new Path2D();
    for (const [a, b] of [[bb0, lerp(bb0, bb1, .5)], [lerp(bb0, bb1, .5), bb1]]) { cab.moveTo(a, dz - 6); const ta = lerp(a, b, .24), tb = lerp(a, b, .76); cab.lineTo(ta, dz - 58); cab.quadraticCurveTo((ta + tb) / 2, dz + 20, tb, dz - 58); cab.lineTo(b, dz - 6); }
    strokeOn(s, cab, col, 1.6);

  sprite(g, cx - 170, cy - 196, 340, 226, sp => drawCoyote(sp, { x: cx, y: cy, dir: s.dir, ang: s.air ? 0 : -Math.atan(slopeAt(s.x)) * .85, phase: s.phase, gait: s.gait, moving: Math.abs(s.vx) > 15,
    air: s.air ? clamp(.4 + s.vy / 900, 0, 1) : 0, duck: s.duck, blink: (s.t % 3.4) < .12, t: s.t, howl: s.won ? clamp(Math.sin(s.wonT * 1.2) , 0, 1) : 0 }));

}
function hud() {
  const s = S0; g.fillStyle = INK.indigo; g.font = '22px "Iowan Old Style", Palatino, Georgia, serif'; g.textBaseline = 'middle';
  g.globalAlpha = .9;
  // the route, as a strip map
  const x0 = W / 2 - 220, x1 = W / 2 + 220, y = 36;
  g.globalAlpha = .35; g.fillRect(x0, y - 1, x1 - x0, 2); g.globalAlpha = .9;
  const stops = [[0, 'Union Sq'], [2200, 'Nob Hill'], [4550, 'Lombard'], [FINISH, 'the Bay']];
  g.font = '13px "Iowan Old Style", Palatino, Georgia, serif'; g.textAlign = 'center';
  for (const [x, n] of stops) { const px = lerp(x0, x1, x / FINISH); g.fillRect(px - 1, y - 5, 2, 10); g.fillText(n, px, y + 17); }
  const px = lerp(x0, x1, clamp(s.x / FINISH, 0, 1)); g.beginPath(); g.arc(px, y, 6, 0, TAU); g.fillStyle = INK.orange; g.fill();
  g.globalAlpha = 1;

/* ── start, win, loop ───────────────────────────────────────────────────── */
const ov = document.getElementById('overlay'), sub = document.getElementById('sub'), go = document.getElementById('go');
function progress(name, u) { sub.textContent = 'Printing the city… ' + Math.round((PROG.done + u) / PROG.total * 100) + '%'; }
const PROG = { done: 0, total: 5 };
function showStart() {
  sub.classList.add('hidden'); document.getElementById('keys').classList.remove('hidden'); document.getElementById('goal').classList.remove('hidden');
  go.classList.remove('hidden'); go.textContent = 'Start'; document.getElementById('ttl').textContent = 'Coyote on the Powell-Hyde Line';
}
function start() { audio(); if (AC.state === 'suspended') AC.resume(); ov.classList.add('hidden'); ov.classList.remove('top'); if (S0.won) reset(); S0.started = true; canvas.focus(); }
function showWin() {
  setTimeout(() => {
    document.getElementById('ttl').textContent = 'You made it to the Bay';
    document.getElementById('goal').textContent = 'Union Square, Nob Hill, Russian Hill, Lombard, and down to the water.';
    document.getElementById('keys').classList.add('hidden'); go.textContent = 'Walk it again'; ov.classList.add('top'); ov.classList.remove('hidden');
  }, 3200);
}
go.onclick = start;
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (!ov.classList.contains('hidden') && !go.classList.contains('hidden') && (e.key.startsWith('Arrow') || e.key === 'Enter' || e.key === ' ')) { start(); }
  if (e.key === ' ') keys.ArrowUp = true; else keys[e.key] = true;
});
addEventListener('keyup', e => { if (e.key === ' ') keys.ArrowUp = false; else keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
for (const b of document.querySelectorAll('#pad button')) {
  const k = b.dataset.k, on = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); if (!ov.classList.contains('hidden') && !go.classList.contains('hidden')) start(); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
}
let last = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
(async () => {
  const bandFor = (OY, hFn, up, down) => (x0, x1) => { let lo = Infinity, hi = -Infinity; for (let x = x0 - 40; x <= x1 + 40; x += 16) { const yy = OY - hFn(x); lo = Math.min(lo, yy); hi = Math.max(hi, yy); } return [Math.floor(lo - up), Math.ceil(hi + down)]; };
  await bakeLayer({ name: 'sky', p: SKY_P, py: 0, width: Math.ceil(W + L * SKY_P) + 80, y0: 0, y1: 720, draw: drawSkyLayer }); PROG.done++;
  await bakeLayer({ name: 'far', p: FAR_P, py: FAR_PY, oy: 0, width: Math.ceil(W + L * FAR_P) + 200, y0: 240, y1: 760, draw: drawFarLayer }); PROG.done++;
  await bakeLayer({ name: 'city', p: CITY_P, py: CITY_PY, oy: -40, width: Math.ceil(W + L * CITY_P) + 300, y0: 60, y1: 900, draw: drawCityLayer }); PROG.done++;
  await bakeLayer({ name: 'houses', p: HOUSE_P, py: HOUSE_PY, oy: BASE - HOY, width: Math.ceil(W + L * HOUSE_P) + 300, bandOf: bandFor(HOY, x => hRow(x) + HOUSE_LIFT, 420, 240), draw: drawHouseLayer }); PROG.done++;
  await bakeLayer({ name: 'ground', p: 1, py: 1, oy: BASE - GOY, width: L + 1000, bandOf: bandFor(GOY, hAt, 110, 460), draw: drawGroundLayer }); PROG.done++;
  reset(); showStart(); requestAnimationFrame(frame);
  window.__game = { S: () => S0, keys, start, reset };
})();
