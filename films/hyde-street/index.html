<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
const CSS=720, W=1080, OUT=1080, K=1, PITCH=4.6, DUR=97;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.
 * Next to the screen it reads as engraving, and it is how a mid-value stops
 * being flat without adding another ink.

   One clock of golden hour: 0 bright late afternoon, 1 sun on the horizon, 1.6
   the Golden Gate after sunset. Faces are lit by a low west-south-west sun.   */
const GOLD = t => t < 60 ? lerp(0.15, 0.55, t / 60) : t < 84 ? lerp(0.55, 1.0, (t - 60) / 24) : lerp(1.0, 1.55, sm((t - 84) / 11));

let SUN = [0, 0, 1], GL = 0;
function skyCov(g) {                       // stops from zenith → horizon
  // few inks per stop: a blue ramp with a warm horizon, turning pink and orange at sunset
  const day = { top: C(0, 0, 0, .60), mid: C(0, 0, 0, .30), hor: C(.16, 0, 0, .08), hz: C(0, 0, .02, .16) };
  const gold = { top: C(0, 0, .04, .58), mid: C(.02, 0, .10, .28), hor: C(.40, .20, .06, 0), hz: C(.04, 0, .08, .13) };
  const dusk = { top: C(0, 0, .20, .52, .30), mid: C(0, .06, .40, .24), hor: C(.50, .58, .28, 0), hz: C(.04, .06, .22, .12) };

  return { top: cmix(a.top, b.top, u), mid: cmix(a.mid, b.mid, u), hor: cmix(a.hor, b.hor, u), hz: cmix(a.hz, b.hz, u) };

let SKY = null;
function drawSky() {
  const [ux, uy] = upV(), x0 = PX + cam.jx, y0 = PY + cam.jy;
  const lin = [x0 + ux * -300, y0 + uy * -300, x0 + ux * 760, y0 + uy * 760], k = 300 / 1060;
  const p = new Path2D(); p.rect(-20, -20, W + 40, W + 40);
  const cov = {}, grd = cmix(C(.10, .06, .06, .14, .14), SKY.hz, 0.3);           // below the horizon: ground, never sky
  for (const n of PL) cov[n] = { lin, as: [grd[n], grd[n], SKY.hor[n], SKY.mid[n], SKY.top[n]], st: [0, k - 0.004, k, k + 0.28 * (1 - k), 1] };

const hazeAt = (d) => 1 - Math.exp(-d / 1400);

/* A face's colour: base pigment, a warm lift where the sun reaches it, a cool
   overprint where it doesn't, and air toward the horizon colour with distance. */
function lit(base, nx, ny, d, shade) {
  const l = clamp(nx * SUN[0] + ny * SUN[1], 0, 1) * clamp(SUN[2] * 3 + 0.35, 0, 1) * (1 - (shade || 0));
  const warm = sm((l - 0.25) / 0.5), cool = 1 - sm((l - 0.1) / 0.4);

  c = cadd(cmul(c, 1 - 0.1 * cool), C(0, 0, .03 * GL, .16, .10), cool);
  return cmix(c, SKY.hz, hazeAt(d) * 0.85);

/* ── strap: a damped pendulum driven by the car's acceleration ────────────────
   Integrated once at load on a fixed step and sampled: pure in t. Its world
   angle is plumb plus the swing; on screen the grade roll is added.         */
const STRAP = (() => {
  const out = new Float32Array(Math.ceil(DUR * 240) + 2), om = TAU * 0.95, z = 0.09;
  let th = 0, w = 0, n = 0;
  for (let i = 0; n < out.length; i++) {
    const t = i / 1200;
    if (i % 5 === 0) out[n++] = th;
    const eq = Math.atan(accel(t) / 9.8) * 1.1;                // swings toward the rear on a pull
    w += (-2 * z * om * w - om * om * (th - eq)) / 1200;
    th += w / 1200;

  return out;
})();
const strapA = t => { const f = clamp(t, 0, DUR) * 240, i = Math.min(f | 0, STRAP.length - 2); return lerp(STRAP[i], STRAP[i + 1], f - i); };

/* ── grade profiles: smoothstep between keyed grades, integrated to height ─── */
function profile(keys, zEnd, y0, y1) {
  const step = 0.25, n = Math.ceil((y1 - y0) / step) + 1, g = new Float32Array(n), z = new Float32Array(n);
  const gAt = (y) => {
    if (y <= keys[0][0]) return keys[0][1];
    for (let i = 0; i < keys.length - 1; i++) if (y <= keys[i + 1][0]) return lerp(keys[i][1], keys[i + 1][1], sm((y - keys[i][0]) / (keys[i + 1][0] - keys[i][0])));
    return keys[keys.length - 1][1];
  };
  for (let i = 0; i < n; i++) g[i] = gAt(y0 + i * step);
  z[n - 1] = zEnd;
  for (let i = n - 2; i >= 0; i--) z[i] = z[i + 1] - (g[i] + g[i + 1]) / 2 * step;
  const at = (arr, y) => { const f = clamp((y - y0) / step, 0, n - 1.001), i = f | 0; return lerp(arr[i], arr[i + 1], f - i); };

}

/* ── the city: building boxes on block perimeters ──────────────────────────────
   A segment supplies its ground(x, y), the cross streets (y bands), the north–
   south streets east of the route (x bands) and a style per block. Lots are
   seeded once at load. Faces are only drawn when they face the camera; boxes
   are painted far to near, which is exact for disjoint boxes on a grid.       */
const FACADE = 8.9;                                        // east building line, m from the camera track
const VIC = [C(.44, .06), C(0, .03, .22, .05), C(.04, 0, .02, .30), C(.30, 0, 0, .24), C(.02, .08, .16, .14),
  C(.22, .28, .03), C(.03, .01, .02, .02), C(.50, .30, .06, 0, .02), C(.10, 0, .30, .02), C(.02, .02, .06, .12, .04)];

const ROAD = C(.03, .02, .05, .20, .26), WALK = C(.08, .04, .03, .05, .06), YARD = C(.34, 0, 0, .30, .14);

function makeCity(o) {
  const bld = [], ground = [], r = rngFor(o.key);
  const xs = o.cols, ys = o.rows;                           // block extents: [[x0,x1]], [[y0,y1]]
  for (let bi = 0; bi < xs.length; bi++) for (let bj = 0; bj < ys.length; bj++) {
    const [x0, x1] = xs[bi], [y0, y1] = ys[bj];
    if (o.skip && o.skip(x0, x1, y0, y1)) continue;
    const kind = o.kind(x0, x1, y0, y1), far = x0 > 200;
    const D = kind === 'hot' ? 22 : 15, lotW = () => far ? 9 + r() * 12 : kind === 'hot' ? 10 + r() * 9 : 6 + r() * 2.8;
    const pal = kind === 'hot' ? HOT : VIC, hgt = () => o.height(kind, r, x0);
    ground.push({ kind: 'yard', x0, x1, y0, y1 });
    const lot = (bx0, bx1, by0, by1, front) => bld.push({ x0: bx0, x1: bx1, y0: by0, y1: by1, kind, front,
      col: pal[(r() * pal.length) | 0], h: hgt(), seed: (r() * 1e9) | 0, far });
    // west row faces the street to the west (the route itself for the first column)
    for (let y = y0; y < y1 - 0.5;) { let w = Math.min(lotW(), y1 - y); if (y1 - y - w < 4) w = y1 - y; lot(x0, x0 + D, y, y + w, 'W'); y += w; }
    // north and south rows face the cross streets
    for (const side of ['S', 'N']) {
      for (let x = x0 + D; x < x1 - 0.5;) {
        let w = Math.min(lotW(), x1 - x); if (x1 - x - w < 4) w = x1 - x;
        if (side === 'S') lot(x, x + w, y0, y0 + Math.min(D, (y1 - y0) / 2), 'S');
        else lot(x, x + w, y1 - Math.min(D, (y1 - y0) / 2), y1, 'N');
        x += w;
      }

    b.fronts = b.front;
    if (o.low && o.low(b)) b.h = Math.min(b.h, 5 + (b.seed % 1000) / 1000 * 7);
    if (o.adjust) o.adjust(b);

    for (const [x, y] of [[b.x0, b.y0], [b.x1, b.y0], [b.x0, b.y1], [b.x1, b.y1]]) { const g = o.ground(x, y); gmax = Math.max(gmax, g); gmin = Math.min(gmin, g); }

/* Faces: start corner, along-axis, outward normal, length. */
function facesOf(b) {
  return [
    { s: [b.x0, b.y0], a: [0, 1], n: [-1, 0], L: b.y1 - b.y0, vis: cam.x < b.x0 },
    { s: [b.x1, b.y1], a: [0, -1], n: [1, 0], L: b.y1 - b.y0, vis: cam.x > b.x1 },
    { s: [b.x1, b.y0], a: [-1, 0], n: [0, -1], L: b.x1 - b.x0, vis: cam.y < b.y0 },
    { s: [b.x0, b.y1], a: [1, 0], n: [0, 1], L: b.x1 - b.x0, vis: cam.y > b.y1 },

}
const fpt = (f, a, z) => [f.s[0] + f.a[0] * a, f.s[1] + f.a[1] * a, z];

function drawBuilding(b, G, dist, defer) {
  const faces = facesOf(b).filter(f => f.vis);
  for (const f of faces) {
    const n = Math.max(1, Math.ceil(f.L / 6)), pts = [];
    for (let i = 0; i <= n; i++) { const a = f.L * i / n, x = f.s[0] + f.a[0] * a, y = f.s[1] + f.a[1] * a; pts.push([x, y, G(x, y) - 0.6]); }
    pts.push(fpt(f, f.L, b.zt), fpt(f, 0, b.zt));
    const p = polyW(pts);
    if (!p) continue;
    const side = f.n[0] === -1 ? 'W' : f.n[0] === 1 ? 'E' : f.n[1] === -1 ? 'S' : 'N';
    const front = b.fronts.includes(side);
    put(p, lit(b.col, f.n[0], f.n[1], dist, front ? 0 : 0.15));
    if (b.nook && f.n[0] === -1) { const job = () => nookFront(b, G, dist); defer ? defer.push(job) : job(); continue; }
    if (dist < 200) facadeDetail(b, f, dist, front, defer);
  }
  if (cam.z > b.zt) {                                     // roof seen from above
    const p = polyW([[b.x0, b.y0, b.zt], [b.x1, b.y0, b.zt], [b.x1, b.y1, b.zt], [b.x0, b.y1, b.zt]]);
    if (p) put(p, cmix(cadd(ROOF, C(.08, .06, .03), 0.4 + GL * 0.6), SKY.hz, hazeAt(dist) * 0.85));
  }
}

/* Beyond ~110 m windows are one mark each, in one ink, and only on fronts:
   finer marks fall below the 4.6 px screen and print as speckle. */
function farWindows(b, f, dist, front, r) {
  if (!front || dist > 190) return;
  const p = new Path2D(); let ok = false;
  const fh = b.kind === 'hot' ? 3.2 : 3.1, zg = b.gmax + (b.kind === 'hot' ? 4.4 : 2.7);
  for (let z = zg + 0.8; z + 1.6 < b.zt - 0.6; z += fh) for (let a = 1.0; a + 1.0 < f.L; a += 2.2) ok = fquad(p, f, a, a + 1.0, z, z + 1.5) || ok;
  if (ok) put(p, cmix(cadd(cmul(b.col, .5), C(0, 0, 0, .34, .12)), SKY.hz, hazeAt(dist) * 0.8));
}
/* A point on a face: along a, height z, out from the wall by o. */
const fpo = (f, a, z, o) => [f.s[0] + f.a[0] * a + f.n[0] * o, f.s[1] + f.a[1] * a + f.n[1] * o, z];
const camSide = (x, y, nx, ny) => (cam.x - x) * nx + (cam.y - y) * ny > 0;

/* Windows, bays, cornices and doors attached to the face plane. Victorian
   fronts get a three-sided bay that really projects, double-hung sashes,
   a garage or door, siding lines and a bracketed cornice that overhangs;
   hotel fronts get storefronts with an awning, window grids, a heavy cornice. */
function facadeDetail(b, f, dist, front, defer) {
  const r = rngFor('fd:' + b.seed + ':' + f.n[0] + f.n[1]);
  const P = {}, has = {};
  const q = (k, a0, a1, z0, z1, o) => {
    if (!P[k]) P[k] = new Path2D();
    const ok = o ? polyInto(P[k], [fpo(f, a0, z0, o), fpo(f, a1, z0, o), fpo(f, a1, z1, o), fpo(f, a0, z1, o)]) : fquad(P[k], f, a0, a1, z0, z1);
    has[k] = has[k] || ok;
  };

  if (dist > 110) return farWindows(b, f, dist, front, r);
  const fh = hot ? 3.2 : 3.1, gf = hot ? 4.4 : 2.7;
  const floors = Math.floor((b.zt - zg - gf - 0.9) / fh);
  const sash = (k, a0, a1, z0, z1, o) => {                // a double-hung window: two panes
    if (near) { const zm = z0 + (z1 - z0) * 0.52; q(k, a0, a1, z0, zm - 0.05, o); q(r() < 0.14 ? 'glint' : k, a0, a1, zm + 0.05, z1, o); }
    else q(r() < 0.1 ? 'glint' : k, a0, a1, z0, z1, o);

    if (f.L > 10) for (let k = 0; k < floors; k++) for (let a = 2.5; a < f.L - 2; a += 5 + r() * 4) {
      const z0 = zg + gf + k * fh + 0.8; q('glass', a, a + 0.9, z0, z0 + 1.5);
    }
  } else if (hot) {
    q('band', 0, f.L, b.zt - 1.0, b.zt);
    const cols = Math.max(1, Math.floor((f.L - 1.2) / 2.5)), pitch = f.L / cols;
    for (let k = 0; k < floors; k++) for (let c = 0; c < cols; c++) {
      const a = c * pitch + pitch / 2, z0 = zg + gf + k * fh + 0.85;
      if (near) q('trim', a - 0.72, a + 0.72, z0 - 0.12, z0 + 1.95);
      sash('glass', a - 0.6, a + 0.6, z0, z0 + 1.8);
    }
    q('band', 0, f.L, zg + gf - 0.35, zg + gf);
    if (near) q('base', 0, f.L, b.gmin - 0.6, zg + gf - 0.35);
    for (let a = 0.6; a < f.L - 1.5; a += 3.7) {

      if (near) { q('mull', (a + a1) / 2 - 0.05, (a + a1) / 2 + 0.05, zb + 0.5, zg + gf - 1.7); q('mull', a, a1, zg + gf - 2.3, zg + gf - 2.2); }

    }
    if (near && b.seed % 5 < 2) {                          // an iron fire escape hung off the front

      for (let k = 0; k < floors; k++) {

        lineW([fpo(f, a0, z, 1.1), fpo(f, a1, z, 1.1)], fe); lineW([fpo(f, a0, z + 1.0, 1.1), fpo(f, a1, z + 1.0, 1.1)], fe);
        for (let a = a0; a <= a1 + 0.01; a += 0.65) lineW([fpo(f, a, z, 1.1), fpo(f, a, z + 1.0, 1.1)], fe);

    if (near) for (let z = zg + gf + 0.2; z < zTop; z += 0.24) q('siding', 0, f.L, z, z + 0.035);
    for (let k = 0; k < nfl; k++) {

      if (px + 1.0 < f.L - 0.3) for (let a = px; a + 0.8 < f.L - 0.3; a += 1.45) {

        sash('glass', a, a + 0.8, z0, z1);
      }
    }
    if (r() < 0.55) q('dark', bx + 0.1, bx + bayW - 0.1, zb, zg + 2.1);          // garage under the bay
    const da = Math.min(f.L - 1.4, px + 0.2);
    q('dark', da, da + 1.0, zg + 0.2, zg + 2.35);                                // front door
    if (near) q('trim', da - 0.2, da + 1.2, zg + 2.35, zg + 2.7);
    // the bay: three sides, projecting 0.75 m, from the garage lintel to the cornice
    if (near) {
      const e = 0.75, c = 0.55, a0 = bx, a1 = bx + bayW, zb0 = zg + gf - 0.25;
      const pts = [[a0, 0], [a0 + c, e], [a1 - c, e], [a1, 0]];
      const job = () => {
        for (let s = 0; s < 3; s++) {
          const [ua, oa] = pts[s], [ub, ob] = pts[s + 1];

          if (!camSide(A[0], A[1], nx, ny)) continue;
          const wall = polyW([[A[0], A[1], zb0], [B[0], B[1], zb0], [B[0], B[1], zTop], [A[0], A[1], zTop]]);

          const gp = new Path2D(), tp = new Path2D(); let g = false;
          for (let k = 0; k < nfl; k++) {
            const z0 = zg + gf + k * fh + 0.75, z1 = z0 + 1.75, m = 0.14;
            const W0 = [lerp(A[0], B[0], m), lerp(A[1], B[1], m)], W1 = [lerp(A[0], B[0], 1 - m), lerp(A[1], B[1], 1 - m)];
            polyInto(tp, [[W0[0], W0[1], z0 - 0.2], [W1[0], W1[1], z0 - 0.2], [W1[0], W1[1], z1 + 0.3], [W0[0], W0[1], z1 + 0.3]]);
            const k0 = [lerp(W0[0], W1[0], .1), lerp(W0[1], W1[1], .1)], k1 = [lerp(W0[0], W1[0], .9), lerp(W0[1], W1[1], .9)];
            g = polyInto(gp, [[k0[0], k0[1], z0], [k1[0], k1[1], z0], [k1[0], k1[1], z1], [k0[0], k0[1], z1]]) || g;
          }
          put(tp, TRIM);
          if (g) put(gp, s === 1 ? GLASS : cadd(GLASS, C(0, 0, 0, -.12, -.08)));
        }
        const under = polyW([fpo(f, a0, zb0, 0), fpo(f, a0 + c, zb0, e), fpo(f, a1 - c, zb0, e), fpo(f, a1, zb0, 0)]);
        if (under && cam.z < zb0) put(under, cadd(lit(b.col, 0, 0, dist, 0), C(0, 0, .04, .12, .2)));
        // cornice: a slab 0.45 m proud with a shadowed soffit and brackets
        const L = f.L, e2 = 0.45, zc = b.zt - 0.7;
        if (cam.z < zc) { const s = polyW([fpo(f, 0, zc, 0), fpo(f, L, zc, 0), fpo(f, L, zc, e2), fpo(f, 0, zc, e2)]); if (s) put(s, cadd(cmul(b.col, .8), C(0, 0, .05, .16, .26))); }
        const cf = polyW([fpo(f, 0, zc, e2), fpo(f, L, zc, e2), fpo(f, L, b.zt, e2), fpo(f, 0, b.zt, e2)]);
        if (cf) put(cf, lit(cadd(cmul(b.col, 0.85), TRIM, 0.6), f.n[0], f.n[1], dist, 0));
        const br = new Path2D();
        for (let a = 0.35; a < L - 0.2; a += 0.95) polyInto(br, [fpo(f, a, zc - 0.5, 0.02), fpo(f, a + 0.2, zc - 0.5, 0.02), fpo(f, a + 0.2, zc, e2 * .9), fpo(f, a, zc, e2 * .9)]);
        put(br, cadd(cmul(b.col, 0.7), C(0, 0, .04, .14, .22)));
      };
      if (defer) defer.push(job); else job();
    } else q('band', 0, f.L, b.zt - 0.65, b.zt);
  }
  const H = c => cmix(c, SKY.hz, haze);
  if (has.siding) put(P.siding, H(cadd(cmul(b.col, 1.0), C(0, 0, .03, .08, .12))));
  if (has.trim) put(P.trim, H(TRIM));
  if (has.glass) put(P.glass, H(GLASS));
  if (has.glint) put(P.glint, H(C(.45 + .15 * GL, .10 + .25 * GL)));
  if (has.dark) put(P.dark, H(C(.04, .06, .12, .32, .42)));
  if (has.band) put(P.band, H(cadd(cmul(b.col, 0.8), C(0, 0, .03, .10, .16))));
  if (has.base) put(P.base, H(cadd(b.col, C(.04, .02, 0, .02, .04))));
  if (has.shop) put(P.shop, H(C(.10, .08, .06, .30, .30)));
  if (has.disp) put(P.disp, H(C(.40 + .1 * GL, .22 + .1 * GL, .05, 0, .04)));
  if (has.mull) put(P.mull, H(C(.04, .06, .12, .32, .42)));
  if (has.awn) put(P.awn, [C(.08, .62, .5, 0, .08), C(.36, 0, 0, .5, .22), C(0, 0, .1, .58, .28), C(.5, .4, .04)][b.seed % 4]);
  if (has.fe) strokeCov(P.fe, C(.04, .1, .16, .4, .56), Math.max(1, FOC * 0.05 / dist));
}

/* Ground strips follow the terrain in short spans so building bases sit on them. */
function groundPoly(G, x0, x1, y0, y1, dz) {
  const nx = Math.max(1, Math.ceil((x1 - x0) / 12)), ny = Math.max(1, Math.ceil((y1 - y0) / 12)), pts = [];
  for (let i = 0; i <= nx; i++) { const x = lerp(x0, x1, i / nx); pts.push([x, y0, G(x, y0) + (dz || 0)]); }
  for (let j = 1; j <= ny; j++) { const y = lerp(y0, y1, j / ny); pts.push([x1, y, G(x1, y) + (dz || 0)]); }
  for (let i = nx - 1; i >= 0; i--) { const x = lerp(x0, x1, i / nx); pts.push([x, y1, G(x, y1) + (dz || 0)]); }
  for (let j = ny - 1; j >= 1; j--) { const y = lerp(y0, y1, j / ny); pts.push([x0, y, G(x0, y) + (dz || 0)]); }
  return polyW(pts);
}
function inView(x, y, rad) {
  const d = Math.hypot(x - cam.x, y - cam.y);
  if (d < rad + 2) return true;
  return Math.abs(angDiff(bearingOf(x, y), viewDir())) < 0.95 + Math.atan(rad / d);
}

/* ── shared scenery pieces ─────────────────────────────────────────────────── */
function drawWater(xNear, yLim, cov) {                     // bay: the z = 0 plane, as a big quad
  const p = polyW(yLim);
  if (p) put(p, cov);
}
function ridgeSil(key, pts, cov) {                          // a far ridge: world points along its crest, closed to sea level
  const p = new Path2D();
  const top = pts.map(q => proj(q[0], q[1], q[2])).filter(Boolean);
  if (top.length < 2) return;
  const bot = pts.map(q => proj(q[0], q[1], 0)).filter(Boolean).reverse();
  [...top, ...bot].forEach((s, i) => i ? p.lineTo(s[0], s[1]) : p.moveTo(s[0], s[1]));
  p.closePath(); put(p, cov);
}
function tree(x, y, z, rad, key, dist, cov) {               // a street or park tree: cut contour, shaded underside
  const c = proj(x, y, z + rad * 1.1);
  if (!c) return;
  const R = FOC * rad / c[2], rr = rngFor(key);
  const blob = cut(ringPts(c[0], c[1], R, R * 0.9, 18, rr() * 3), rr, { amp: 0.16 });
  const base = cov || C(.40, 0, 0, .42, .18);
  put(blob, cmix(cadd(base, C(.1 + .1 * GL, .05 * GL)), SKY.hz, hazeAt(dist) * 0.8));
  const sh = new Path2D(); sh.ellipse(c[0] + R * .15, c[1] + R * .35, R * .8, R * .5, 0, 0, TAU);
  const g = new Path2D(); g.addPath(blob);
  // underside shadow clipped by overprinting only inside the blob
  for (const n of ['blue', 'indigo']) { const pg = PG[n]; pg.save(); pg.clip(blob); pg.globalCompositeOperation = 'source-over'; pg.globalAlpha = (n === 'blue' ? .18 : .22) * (1 - hazeAt(dist)); pg.fill(sh); pg.restore(); }
  const tr = proj(x, y, z);
  if (tr && R > 3) { const t = new Path2D(); t.moveTo(tr[0] - R * .07, tr[1]); t.lineTo(c[0] - R * .05, c[1] + R * .5); t.lineTo(c[0] + R * .05, c[1] + R * .5); t.lineTo(tr[0] + R * .07, tr[1]); t.closePath(); put(t, C(.1, .3, .2, .1, .45)); }
}
function lampPole(x, y, z, dist) {                          // a plain street light: world-vertical, so it leans with the grade
  const a = proj(x, y, z), b = proj(x, y, z + 7.2), c = proj(x - 1.4, y, z + 7.0);
  if (!a || !b) return;
  const w = Math.max(1.2, FOC * 0.16 / a[2]), p = new Path2D();
  p.moveTo(a[0], a[1]); p.lineTo(b[0], b[1]); if (c) p.lineTo(c[0], c[1]);
  const cov = cmix(C(.05, .06, .1, .3, .45), SKY.hz, hazeAt(dist) * 0.6);
  for (const n of PL) { const g = PG[n]; g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1; g.lineWidth = w; g.stroke(p); if (cov[n]) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = cov[n]; g.stroke(p); } }
}

/* ── Hyde Street: Russian Hill crest, Lombard's switchbacks, the plunge ─────
   Grades from the real line: a steady climb from Jackson, level across
   Lombard, then 21% down to Beach. Telegraph Hill is a bump in the same terrain,
   so its houses climb it; Coit Tower stands in the park at its summit.       */
const NOOK = { y0: 120, y1: 129 };                             // Nook's corner lot on Hyde, north of Jackson
const HYDE = (() => {
  const prof = profile([[0, .10], [40, .12], [100, .12], [146, 0], [172, 0], [190, -.21], [268, -.21], [294, 0], [400, 0]], 3.5, 0, 400);
  const TX = 245, TY = 168;
  const TH = (x, y) => 26 * Math.exp(-((x - TX) ** 2 + (y - TY) ** 2) / (2 * 50 * 50));
  const G = (x, y) => { const zr = prof.z(y); return (x <= FACADE ? zr : 2.5 + (zr - 2.5) * Math.exp(-(x - FACADE) / 80)) + TH(x, y); };
  const cols = [[FACADE, 109], [123, 203], [217, 297], [311, 391], [405, 485], [499, 575]];
  const rows = [[40, 64], [80, 104], [120, 150], [170, 193], [207, 229], [243, 261], [275, 293]];
  const streetsY = [[64, 80], [104, 120], [150, 170], [193, 207], [229, 243], [261, 275], [293, 307]];
  const streetsX = [[109, 123], [203, 217], [297, 311], [391, 405], [485, 499]];
  const city = makeCity({
    key: 'hyde:city', cols, rows, ground: G,
    skip: (x0, x1, y0, y1) => Math.hypot((x0 + x1) / 2 - TX, (y0 + y1) / 2 - TY) < 50,
    kind: (x0) => x0 > 480 ? 'hot' : 'vic',
    height: (kind, r, x0) => kind === 'hot' ? 9 + r() * 9 : r() < 0.14 ? 12 + r() * 6 : 7.2 + r() * 3.6,
    adjust: (b) => {                                        // Lombard's houses sit back behind gardens
      if (b.x0 < 109 && b.y1 === 150) { b.y1 -= 3; if (b.x0 === FACADE) { b.h = Math.min(b.h, 7.4); b.fronts = 'WS'; } }
      if (b.x0 < 109 && b.y0 === 170) { b.y0 += 3; if (b.x0 === FACADE) { b.h = Math.min(b.h, 7.4); b.fronts = 'WN'; } }
      if (b.x0 === FACADE && b.y0 === 120) { b.y1 = NOOK.y1; b.h = 11; b.col = C(.06, .03, 0, .02, .02); b.nook = true; b.fronts = 'WS'; }   // Nook's corner
      if (b.x0 === FACADE && b.y0 > 120 && b.y0 < NOOK.y1) b.y0 = NOOK.y1;
    },
  });
  // Telegraph Hill park trees and Coit Tower
  const park = [], rp = rngFor('hyde:park');
  for (let i = 0; i < 70; i++) {
    const a = rp() * TAU, rr = 9 + Math.sqrt(rp()) * 40, x = TX + Math.cos(a) * rr, y = TY + Math.sin(a) * rr * 1.2;
    park.push({ x, y, rad: 3 + rp() * 3.5, key: 'hyde:pt:' + i });
  }
  const street = [], rs = rngFor('hyde:street');
  for (let y = 44; y < 300; y += 24 + rs() * 10) if (!streetsY.some(([a, b]) => y > a - 2 && y < b + 2)) street.push({ kind: 'lamp', x: 6.6, y });
  for (let y = 48; y < 300; y += 9 + rs() * 16) if (!streetsY.some(([a, b]) => y > a - 3 && y < b + 3) && !(y > 117 && y < 132) && rs() < 0.55) street.push({ kind: 'tree', x: 7.3, y, rad: 1.6 + rs() * 1.1, key: 'hyde:st:' + y.toFixed(1) });
  // Lombard's crooked block: eight hairpins in 96 m, between Hyde and Leavenworth
  const LOMB = [], LW = 3.1;
  for (let x = 9.5; x <= 105; x += 0.5) LOMB.push([x, 160 + 5.8 * Math.sin(Math.PI * (x - 9.5) / 12)]);
  const flowers = [], rf = rngFor('hyde:flowers');
  for (let i = 0; i < 260; i++) {
    const x = 10 + rf() * 95, y = 152.6 + rf() * 14.8, yc = 160 + 5.8 * Math.sin(Math.PI * (x - 9.5) / 12);
    if (Math.abs(y - yc) < LW / 2 + 0.5) continue;
    flowers.push({ x, y, r: 0.22 + rf() * 0.22, c: rf() < 0.55 ? 0 : rf() < 0.6 ? 1 : 2 });
  }
  return { prof, G, TX, TY, city, park, street, streetsY, streetsX, LOMB, LW, flowers, cols, rows };
})();

function hydeFar(t) {
  const H = HYDE;
  // East Bay hills, then the bay, Yerba Buena Island and the Bay Bridge
  const eb = [];
  for (let y = -5200; y <= 6000; y += 300) eb.push([3000 + 300 * Math.sin(y / 1700), y, 90 + 45 * Math.sin(y / 900 + 1) + 22 * Math.sin(y / 330)]);
  ridgeSil('eb', eb, cmix(C(.06, .04, .14, .30, .10), SKY.hz, 0.55));
  drawWater(0, [[560, -6000, 0], [9000, -6000, 0], [9000, 9000, 0], [-400, 9000, 0], [-400, 322, 0], [560, 322, 0]], cmix(C(0, 0, .03, .56, .14), SKY.hz, 0.18));
  const ybi = []; for (let k = 0; k <= 16; k++) { const a = k / 16; ybi.push([1330 + 170 * Math.cos(a * Math.PI), -190 + 45 * Math.sin(a * Math.PI), 2 + 30 * Math.sin(a * Math.PI) ** 0.7]); }
  ridgeSil('ybi', ybi, cmix(C(.28, 0, .03, .36, .22), SKY.hz, 0.35));
  bridgeSpan([600, -560], [1250, -230], 0.3);
}
/* Coit Tower: a fluted shaft, an arcaded crown, a low base among trees. */
function coitTower(dist) {
  const H = HYDE, x = H.TX, y = H.TY, z0 = H.G(x, y) + 5, R = 6.2, Ht = 66;
  const b = bearingOf(x, y), px = Math.cos(b), py = -Math.sin(b);            // horizontal, perpendicular to the ray
  const at = (s, z) => [x + px * s, y + py * s, z];
  const shaft = polyW([at(-R, z0), at(R, z0), at(R * .92, z0 + Ht), at(-R * .92, z0 + Ht)]);
  const crown = polyW([at(-R * 1.08, z0 + Ht - 6), at(R * 1.08, z0 + Ht - 6), at(R * 1.08, z0 + Ht), at(-R * 1.08, z0 + Ht)]);
  const cap = polyW([at(-R * .8, z0 + Ht), at(R * .8, z0 + Ht), at(R * .55, z0 + Ht + 3.5), at(-R * .55, z0 + Ht + 3.5)]);
  const base = polyW([at(-15, z0 - 5), at(15, z0 - 5), at(15, z0 + 5), at(-15, z0 + 5)]);
  const warm = C(.22 + .12 * GL, .10 + .24 * GL, .02 + .08 * GL);
  const stone = cmix(cadd(C(.04, .02, .01), warm), SKY.hz, hazeAt(dist) * 0.5);
  if (base) put(base, cadd(stone, C(0, 0, .02, .06, .08)));
  if (shaft) put(shaft, stone);
  const shadow = polyW([at(-R, z0), at(-R * .35, z0), at(-R * .32, z0 + Ht), at(-R * .92, z0 + Ht)]);
  if (shadow) add(shadow, C(0, 0, .06, .16, .18));
  const fl = new Path2D();
  for (let k = -3; k <= 3; k++) { const s = k * R * .26; lineW([at(s, z0 + 1), at(s * .95, z0 + Ht - 6)], fl); }
  for (const n of ['blue', 'indigo']) { const g = PG[n]; g.globalCompositeOperation = 'source-over'; g.globalAlpha = .22; g.lineWidth = 0.8; g.stroke(fl); }
  if (crown) put(crown, cadd(stone, C(0, 0, .02, .05, .05)));
  const arch = new Path2D();
  for (let k = -2; k <= 2; k++) { const s = k * R * .38; polyInto(arch, [at(s - .9, z0 + Ht - 5), at(s + .9, z0 + Ht - 5), at(s + .9, z0 + Ht - 1.6), at(s - .9, z0 + Ht - 1.6)]); }
  put(arch, C(.04, .1, .2, .3, .5));
  if (cap) put(cap, cadd(stone, C(0, .02, .02, .06, .08)));
}

/* Lombard's crooked block: garden, brick switchbacks, hedges, hydrangeas, the
   stepped sidewalks. Everything rides the terrain. */
function lombard(dist) {
  const H = HYDE, G = H.G;
  const bed = groundPoly(G, FACADE, 109, 150, 170, 0.05);
  if (bed) put(bed, lit(C(.42, 0, .04, .40, .20), 0, 0, dist, 0));
  // stepped sidewalks: pale treads with shadow risers
  const walk = new Path2D(), riser = new Path2D();
  for (const [ya, yb] of [[150, 152.4], [167.6, 170]]) {
    polyInto(walk, [[FACADE, ya, G(FACADE, ya) + .1], [109, ya, G(109, ya) + .1], [109, yb, G(109, yb) + .1], [FACADE, yb, G(FACADE, yb) + .1]]);
    for (let x = FACADE + 1; x < 109; x += 0.9) polyInto(riser, [[x, ya, G(x, ya) + .1], [x + .22, ya, G(x, ya) + .1], [x + .22, yb, G(x, yb) + .1], [x, yb, G(x, yb) + .1]]);
  }
  put(walk, lit(WALK, 0, 0, dist, 0)); add(riser, C(0, 0, .04, .12, .16));
  // the road ribbon
  const L = H.LOMB, w = H.LW / 2, left = [], right = [];
  for (let i = 0; i < L.length; i++) {
    const [x, y] = L[i], [xa, ya] = L[Math.max(0, i - 1)], [xb, yb] = L[Math.min(L.length - 1, i + 1)];
    let nx = -(yb - ya), ny = xb - xa; const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
    left.push([x + nx * w, y + ny * w]); right.push([x - nx * w, y - ny * w]);
  }
  const road = polyW([...left.map(([x, y]) => [x, y, G(x, y) + 0.12]), ...right.reverse().map(([x, y]) => [x, y, G(x, y) + 0.12])]);
  if (road) put(road, cmix(C(.06, .66, .48, 0, .08), SKY.hz, hazeAt(dist) * .5));
  right.reverse();
  // hedges on both edges: a low wall following the curb
  const hedge = new Path2D();
  for (const edge of [left, right]) {
    for (let i = 0; i < edge.length - 1; i += 2) {
      const [x0, y0] = edge[i], [x1, y1] = edge[Math.min(edge.length - 1, i + 2)];
      polyInto(hedge, [[x0, y0, G(x0, y0)], [x1, y1, G(x1, y1)], [x1, y1, G(x1, y1) + 0.75], [x0, y0, G(x0, y0) + 0.75]]);
    }
  }
  put(hedge, cmix(C(.36, 0, 0, .62, .46), SKY.hz, hazeAt(dist) * .5));
  // hydrangeas and roses in the beds
  const fl = [new Path2D(), new Path2D(), new Path2D()], has = [false, false, false];
  for (const f of H.flowers) {
    const s = proj(f.x, f.y, G(f.x, f.y) + 0.5);
    if (!s) continue;
    const rr = Math.max(0.9, FOC * f.r / s[2]);
    fl[f.c].moveTo(s[0] + rr, s[1]); fl[f.c].ellipse(s[0], s[1], rr, rr * 0.8, 0, 0, TAU); has[f.c] = true;
  }
  const FC = [C(0, .05, .70, .05), C(0, 0, .30, .55, .04), C(.10, .55, .25)];
  for (let k = 0; k < 3; k++) if (has[k]) put(fl[k], cmix(FC[k], SKY.hz, hazeAt(dist) * 0.5));
}

function hydeGround(t) {
  const H = HYDE, G = H.G;
  // land under the grid, down to the shore
  for (const [x0, x1, y0, y1] of [[FACADE, 580, -900, 40], [FACADE, 580, 293, 322], [575, 580, 40, 293]]) {   // land outside the block grid, in near-planar strips
    const land = groundPoly(G, x0, x1, y0, y1, -0.4);
    if (land) put(land, lit(C(.10, .06, .06, .10, .10), 0, 0, 300, 0));
  }
  for (const g of H.city.ground) {
    if (!inView((g.x0 + g.x1) / 2, (g.y0 + g.y1) / 2, 60)) continue;
    const p = groundPoly(G, g.x0, g.x1, g.y0, g.y1, 0.02);
    if (p) put(p, lit(YARD, 0, 0, Math.hypot((g.x0 + g.x1) / 2 - cam.x, (g.y0 + g.y1) / 2 - cam.y), 0));
  }
  const pk = groundPoly(G, 203, 297, 120, 229, 0.02);
  if (pk) put(pk, lit(C(.42, 0, 0, .40, .18), 0, 0, 350, 0));
  for (const [y0, y1] of H.streetsY) {
    if (y0 === 150) { const p = groundPoly(G, 109, 575, y0 + 2, y1 - 2, 0.04); if (p) put(p, lit(ROAD, 0, 0, 200, 0)); continue; }
    const p = groundPoly(G, FACADE, 575, y0, y1, 0.04);
    if (p) put(p, lit(ROAD, 0, 0, Math.abs(cam.y - (y0 + y1) / 2) + 60, 0));
  }
  for (const [x0, x1] of H.streetsX) { const p = groundPoly(G, x0, x1, 40, 293, 0.03); if (p) put(p, lit(ROAD, 0, 0, x0, 0)); }
  // our own street: the lane, the curb, the sidewalk (not while the turntable swings the car across them)
  if (t > T_TURN0 - 0.05) return lombard(Math.hypot(40, cam.y - 160));
  const y0 = cam.y - 40, y1 = cam.y + 60;
  const rd = groundPoly(G, 1.2, FACADE + 0.5, y0, y1, 0), wk = new Path2D(), cb = new Path2D();
  if (rd) put(rd, lit(ROAD, 0, 0, 5, 0));
  for (const [a, b] of [[20, 64], [80, 104], [120, 150], [170, 193], [207, 229], [243, 261], [275, 293]]) {
    if (b < y0 || a > y1) continue;
    polyInto(wk, [[6.2, a, G(0, a) + .16], [FACADE, a, G(0, a) + .16], [FACADE, b, G(0, b) + .16], [6.2, b, G(0, b) + .16]]);
    polyInto(cb, [[6.0, a, G(0, a)], [6.2, a, G(0, a) + .16], [6.2, b, G(0, b) + .16], [6.0, b, G(0, b)]]);
  }
  put(wk, lit(WALK, -0.35, 0, 7, 0)); put(cb, C(.02, .02, .03, .06, .08));
  lombard(Math.hypot(40, cam.y - 160));
  if (t > 49 && t < 70) lombardCars(t);
}

const paintSorted = (items) => { items.sort((a, b) => b.d - a.d); for (const it of items) it.f(it.d); };
function hydeObjects(t, bay) {
  const H = HYDE, items = [];
  const row = [], street = [], defer = [];
  for (const b of H.city.bld) if (inView(b.cx, b.cy, b.rad)) (b.x0 === FACADE ? row : items).push({ d: Math.hypot(b.cx - cam.x, b.cy - cam.y), f: (d) => drawBuilding(b, H.G, d, b.x0 === FACADE ? defer : null) });
  for (const p of H.park) if (inView(p.x, p.y, 8)) items.push({ d: Math.hypot(p.x - cam.x, p.y - cam.y), f: (d) => tree(p.x, p.y, H.G(p.x, p.y), p.rad, p.key, d) });
  items.push({ d: Math.hypot(H.TX - cam.x, H.TY - cam.y) + 1, f: coitTower });
  if (bay) { wharfObjects(t, items); items.push({ d: 90, f: () => gulls(t) }); }
  for (const s of H.street) {
    if (Math.abs(s.y - cam.y) > 60) continue;
    const d = Math.hypot(s.x - cam.x, s.y - cam.y);
    if (s.kind === 'lamp') street.push({ d, f: (d) => lampPole(s.x, s.y, H.G(0, s.y) + .16, d) });
    else street.push({ d, f: (d) => tree(s.x, s.y, H.G(0, s.y) + .16, s.rad, s.key, d, C(.46, 0, 0, .36, .16)) });
  }
  if (Math.abs(cam.y - 124) < 40) street.push({ d: 7, f: () => cafeTables(H.G, t) });
  paintSorted(items); paintSorted(row); for (const j of defer) j(); paintSorted(street);
}

/* ── the cabin ─────────────────────────────────────────────────────────────────
   A Powell car's enclosed section, across the aisle: tall windows with rounded
   upper corners in varnished frames, a header rail, the curved ceiling with its
   ribs and the little clerestory lights, a maroon wainscot, the slatted bench,
   a grab pole. Observed from photographs of Powell cars (HAER CA-12 interior
   views; a 2010s interior photograph on Wikimedia Commons). Baked once into
   per-plate coverage and laid over the live view through the window openings. */
const WIN = { x0: 152, x1: 928, y0: 178, y1: 792, r: 88 };
function winPath(p, x0, x1, y0, y1, r) {
  p.moveTo(x0, y1); p.lineTo(x0, y0 + r); p.arcTo(x0, y0, x0 + r, y0, r);
  p.lineTo(x1 - r, y0); p.arcTo(x1, y0, x1, y0 + r, r); p.lineTo(x1, y1); p.closePath();
